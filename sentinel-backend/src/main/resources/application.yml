spring:
  application:
    name: sentinel-backend

  # Default profile uses H2 for quick local dev
  datasource:
    url: jdbc:h2:mem:sentinel;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# CORS configuration for frontend
sentinel:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001

---
# PostgreSQL profile
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/sentinel
    driver-class-name: org.postgresql.Driver
    username: sentinel
    password: sentinel

  flyway:
    locations: classpath:db/migration

  h2:
    console:
      enabled: false
