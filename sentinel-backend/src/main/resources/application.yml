spring:
  profiles:
    active: postgres
  application:
    name: sentinel-backend

  # Default profile uses H2 for quick local dev
  datasource:
    url: jdbc:h2:mem:sentinel;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# CORS configuration for frontend
sentinel:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
  jwt:
    secret: sentinel-hse-jwt-secret-key-must-be-at-least-32-chars-long!
    expiration-ms: 86400000  # 24 hours
  etl:
    enabled: true
    # Path to the JSON written by sentinel/src/run_pipeline.py
    # Adjust if your sentinel/ folder lives elsewhere relative to sentinel-backend/
    live-batch-path: ../sentinel/data/warehouse/live_batch.json
    sentinel-dir: ../sentinel        # root of the Python project (contains run_live.sh)

    # ── Timing & volume ─────────────────────────────────────────────────────
    # poll-interval-ms  : how often Spring Boot reads live_batch.json AND
    #                     the interval passed to run_live.sh (Python ETL cycle)
    # rows-per-cycle    : synthetic rows generated per Python ETL run
    # frontend-refresh-ms: how often the Next.js dashboard calls router.refresh()
    #                      should be slightly longer than poll-interval-ms so the
    #                      DB is already updated before the UI re-fetches
    poll-interval-ms: 120000         # 2 minutes
    rows-per-cycle: 200              # increased from 50 — ~80 incidents / 60 audits / 60 telemetry
    frontend-refresh-ms: 125000      # 2 min 5 s — gives the DB a 5 s head start

---
# PostgreSQL profile
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/sentinel
    driver-class-name: org.postgresql.Driver
    username: sentinel
    password: sentinel

  flyway:
    locations: classpath:db/migration

  h2:
    console:
      enabled: false
