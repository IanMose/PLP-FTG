spring:
  profiles:
    active: default
  application:
    name: sentinel-backend

  # Default profile — H2 in-memory for quick local dev.
  # To run against local Postgres: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
  # On Render, SPRING_PROFILES_ACTIVE=render is injected via render.yaml — no hardcoding needed.
  datasource:
    url: jdbc:h2:mem:sentinel;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  defer-datasource-initialization: true

  flyway:
    enabled: false

  sql:
    init:
      mode: always
      data-locations: classpath:data-h2.sql

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sentinel:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-in-production-minimum-32-chars}
    expiration-ms: 86400000 # 24 hours
  etl:
    enabled: ${ETL_ENABLED:true}
    live-batch-path: ${ETL_LIVE_BATCH_PATH:../sentinel/data/warehouse/live_batch.json}
    sentinel-dir: ${ETL_SENTINEL_DIR:../sentinel} # root of the Python project (contains run_live.sh)

    # ── Timing & volume ─────────────────────────────────────────────────────
    poll-interval-ms: 120000 # 2 minutes
    rows-per-cycle: 200
    frontend-refresh-ms: 125000 # 2 min 5 s

  # ── LLM narrative enhancement (optional stretch goal) ─────────────────────
  # Set GROQ_API_KEY env var to enable. If blank/missing, NarrativeService
  # falls back to the templated narrative silently — no errors, no crashes.
  # Get a free key at https://console.groq.com
  llm:
    groq-api-key: ${GROQ_API_KEY:}
    model: openai/gpt-oss-20b
    timeout-ms: 3000 # 3 second hard timeout — never block alert creation
    enabled: ${LLM_ENABLED:true}

  # ── Slack integration (Stage 3 Control Plane) ─────────────────────────────
  # Configure SLACK_WEBHOOK_URL to enable real Slack notifications.
  # When disabled or webhook missing, SlackNotificationService logs instead of posting.
  # Create a webhook at https://api.slack.com/apps → Incoming Webhooks
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
    enabled: ${SLACK_ENABLED:false}
    channel: ${SLACK_CHANNEL:#sentinel-alerts}

  # ── SMS integration via Africa's Talking (Critical alerts) ────────────────
  # Configure AT_API_KEY and AT_USERNAME to enable SMS notifications.
  # Sign up at https://africastalking.com → Get API key from dashboard.
  # SMS is sent only for Critical severity events (configurable via critical-only).
  # Phone numbers must be in international format (+254... for Kenya).
  sms:
    api-url: ${AT_API_URL:https://api.africastalking.com/version1/messaging}
    api-key: ${AT_API_KEY:}
    username: ${AT_USERNAME:}
    sender-id: ${AT_SENDER_ID:SENTINEL}  # Requires approval from AT for custom sender
    enabled: ${SMS_ENABLED:false}
    critical-only: ${SMS_CRITICAL_ONLY:true}  # Only send SMS for Critical severity

  # ── Dashboard URL for Slack message links ─────────────────────────────────
  dashboard:
    url: ${DASHBOARD_URL:http://localhost:3000}

---
# PostgreSQL profile — local dev only
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# 
# HYBRID APPROACH: Flyway creates schema on first run, Hibernate validates.
# For subsequent runs, Flyway only applies new migrations (V3+).
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/sentinel
    driver-class-name: org.postgresql.Driver
    username: sentinel
    password: sentinel

  jpa:
    hibernate:
      ddl-auto: none  # Flyway manages schema
    show-sql: false

  defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false  # Don't fail on checksum changes

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: false

# Render production config lives in application-render.yml
# (activated by SPRING_PROFILES_ACTIVE=render set in render.yaml)
