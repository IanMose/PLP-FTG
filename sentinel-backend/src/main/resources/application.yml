spring:
  application:
    name: sentinel-backend

  # Default profile uses H2 for quick local dev
  datasource:
    url: jdbc:h2:mem:sentinel;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# CORS configuration for frontend
sentinel:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    secret: Gric/GyqJGMk3dwMleaADNDcBGQ3qfOYUmPSDnXSy6lDIfYAG7cY06WPJNJp+Yor
    expiration-ms: 86400000  # 24 hours
  etl:
    enabled: ${ETL_ENABLED:true}
    # Path to the JSON written by sentinel/src/run_pipeline.py
    # Adjust if your sentinel/ folder lives elsewhere relative to sentinel-backend/
    live-batch-path: ${ETL_LIVE_BATCH_PATH:../sentinel/data/warehouse/live_batch.json}
    sentinel-dir: ${ETL_SENTINEL_DIR:../sentinel}   # root of the Python project (contains run_live.sh)
    api-key: ${ETL_API_KEY:}

    # ── Timing & volume ─────────────────────────────────────────────────────
    poll-interval-ms: 120000         # 2 minutes
    rows-per-cycle: 200
    frontend-refresh-ms: 125000      # 2 min 5 s

---
# PostgreSQL profile (local dev with explicit postgres activation)
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/sentinel
    driver-class-name: org.postgresql.Driver
    username: sentinel
    password: sentinel

  flyway:
    locations: classpath:db/migration

  h2:
    console:
      enabled: false

# Render production config lives in application-render.yml
# (activated by SPRING_PROFILES_ACTIVE=render set in render.yaml)
