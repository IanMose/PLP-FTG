spring:
  application:
    name: sentinel-backend

  # Active profile — postgres local dev
  profiles:
    active: postgres

  # H2 fallback (not used when postgres profile is active)
  datasource:
    url: jdbc:h2:mem:sentinel;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  # defer-datasource-initialization is needed for H2 only (ensures JPA creates
  # tables before data-h2.sql runs). Must be false for Flyway profiles to avoid
  # circular dependency between flyway and entityManagerFactory beans.
  defer-datasource-initialization: true

  flyway:
    enabled: false

  sql:
    init:
      mode: always
      data-locations: classpath:data-h2.sql

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

sentinel:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    secret: Gric/GyqJGMk3dwMleaADNDcBGQ3qfOYUmPSDnXSy6lDIfYAG7cY06WPJNJp+Yor
    expiration-ms: 86400000  # 24 hours
  etl:
    enabled: ${ETL_ENABLED:true}
    live-batch-path: ${ETL_LIVE_BATCH_PATH:../sentinel/data/warehouse/live_batch.json}
    sentinel-dir: ${ETL_SENTINEL_DIR:../sentinel}
    api-key: ${ETL_API_KEY:}
    poll-interval-ms: 120000
    rows-per-cycle: 200
    frontend-refresh-ms: 125000

---
# PostgreSQL profile — local dev
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/sentinel
    driver-class-name: org.postgresql.Driver
    username: sentinel
    password: sentinel

  jpa:
    hibernate:
      ddl-auto: none

  # Disable H2 deferred init — causes circular dependency with Flyway
  defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: false

# Render production config lives in application-render.yml
