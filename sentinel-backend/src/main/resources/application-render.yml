# application-render.yml
# Active when SPRING_PROFILES_ACTIVE=render (set by render.yaml).
# Overrides only the values that differ from the defaults in application.yml.

spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000    # 30s before giving up on a new connection
      idle-timeout: 600000         # 10 min before retiring idle connections
      max-lifetime: 1800000        # 30 min max connection lifetime
      pool-name: SentinelHikariCP

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false
    validate-on-migrate: true

  sql:
    init:
      mode: never

  # H2 console is dev-only — never expose in production
  h2:
    console:
      enabled: false

# ETL requires the Python pipeline to be co-located on disk.
# On Render only the JAR runs, so ETL must be off.
sentinel:
  etl:
    enabled: false
  # Enable Kafka on Render once KAFKA_* secrets are set in the dashboard.
  kafka:
    enabled: ${KAFKA_ENABLED:false}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: sentinel-backend
      auto-offset-reset: earliest
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
