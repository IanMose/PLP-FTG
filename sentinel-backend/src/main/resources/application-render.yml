# application-render.yml
# Active when SPRING_PROFILES_ACTIVE=render (set by render.yaml).
# Overrides only the values that differ from the defaults in application.yml.
#
# PRODUCTION APPROACH:
# - Flyway manages schema migrations (consolidated, idempotent)
# - Hibernate only validates that entities match schema (never modifies)

spring:
  datasource:
    # JDBC URL must NOT contain credentials — pass them separately
    # Format: jdbc:postgresql://host:port/database
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/sentinel}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:sentinel}
    password: ${DB_PASSWORD:sentinel}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000    # 30s before giving up on a new connection
      idle-timeout: 600000         # 10 min before retiring idle connections
      max-lifetime: 1800000        # 30 min max connection lifetime
      pool-name: SentinelHikariCP

  jpa:
    hibernate:
      ddl-auto: validate  # PRODUCTION: Only verify schema matches entities, never modify
    show-sql: false

  defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: false
    validate-on-migrate: false  # Don't fail on checksum changes during migration consolidation

  sql:
    init:
      mode: never

  # H2 console is dev-only — never expose in production
  h2:
    console:
      enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: sentinel-backend
      auto-offset-reset: earliest
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

# ETL requires the Python pipeline to be co-located on disk.
# On Render only the JAR runs, so ETL must be off.
sentinel:
  etl:
    enabled: false
  # Enable Kafka on Render once KAFKA_* secrets are set in the dashboard.
  kafka:
    enabled: ${KAFKA_ENABLED:false}
