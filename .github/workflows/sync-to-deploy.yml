# Sync changes from IanMose/PLP-FTG to kariukialex999/sentinel
# Triggers on every push to main branch

name: Sync to Deploy Repo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify token exists
        run: |
          if [ -z "${{ secrets.DEPLOY_TOKEN }}" ]; then
            echo "ERROR: DEPLOY_TOKEN secret is not set!"
            exit 1
          fi
          echo "Token is set (length: ${#DEPLOY_TOKEN} chars)"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Push to deploy repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git remote add deploy "https://x-access-token:${DEPLOY_TOKEN}@github.com/kariukialex999/sentinel.git"
          git push deploy main --force
